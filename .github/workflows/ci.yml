name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run test:db
      - name: PowerShell backup safety checks
        shell: pwsh
        run: ./scripts/backup/tests/Test-BackupCore.ps1
      - name: Synthetic PostgreSQL 17.11 backup restore
        shell: pwsh
        run: |
          try { ./scripts/backup/tests/Test-BackupIntegration.ps1 }
          catch {
            Write-Host ("::error title=Backup integration exception::type=" + $_.Exception.GetType().FullName + "; script_line=" + $_.InvocationInfo.ScriptLineNumber)
            throw
          }
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/

  backup-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Windows PowerShell parsing and safety checks (no real backup)
        shell: pwsh
        run: ./scripts/backup/tests/Test-BackupCore.ps1
