name: Refresh bundled MapLibre lockfile
on:
  push:
    branches:
      - work/correcao-real-mapa-3d
    paths:
      - package.json
      - .github/workflows/refresh-maplibre-lock.yml
permissions:
  contents: write
jobs:
  update-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/correcao-real-mapa-3d
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate lockfile without running package scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit reproducible dependency lock
        shell: bash
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: lock MapLibre 6.16.0 dependency"
            git push origin HEAD:work/correcao-real-mapa-3d
          fi
